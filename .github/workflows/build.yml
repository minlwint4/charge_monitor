name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android with V2 Embedding
        run: |
          rm -rf android
          flutter create . --platforms android --org com.dataplus

      # ၁။ Wi-Fi ဖြတ်တောက်ခွင့် Permission များ အပါအဝင် AndroidManifest ထည့်သွင်းခြင်း
      - name: Inject AndroidManifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD"/>

              <application
                  android:label="charge_monitor"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      # ၂။ Wi-Fi Disconnect စနစ်ပါဝင်သော MainActivity.kt ကို ထည့်သွင်းခြင်း
      - name: Inject Native MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/dataplus/charge_monitor
          cat << 'EOF' > android/app/src/main/kotlin/com/dataplus/charge_monitor/MainActivity.kt
          package com.dataplus.charge_monitor

          import android.app.KeyguardManager
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.Process
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.example.charge_monitor/app_control"
              private var mediaPlayer: MediaPlayer? = null
              private var wakeLock: PowerManager.WakeLock? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startAlarm" -> {
                              wakeUpScreen()
                              startAlarmSound()
                              result.success(true)
                          }
                          "stopAlarm" -> {
                              stopAlarmSound()
                              releaseWakeLock()
                              result.success(true)
                          }
                          "killAppLikeSwipe" -> {
                              result.success(true)
                              stopAlarmSound()
                              releaseWakeLock()

                              // ၁။ Wi-Fi လိုင်းကို ဖြုတ်ချမည် (Disconnect)
                              disconnectWifi()

                              // ၂။ Background Service ကို ရပ်တန့်မည်
                              try {
                                  val serviceIntent = Intent(this, Class.forName("de.julianassmann.flutter_background.IsolateHolderService"))
                                  stopService(serviceIntent)
                              } catch (e: Exception) {}

                              // ၃။ Notification အားလုံးကို ဖျက်မည်
                              try {
                                  val notificationManager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                                  notificationManager.cancelAll()
                              } catch (e: Exception) {}

                              // ၄။ Tab ကို အပြီးသတ် ဖယ်ရှားမည်
                              finishAndRemoveTask()

                              // ၅။ Process ကို အပြီးသတ် သတ်ပစ်မည်
                              Handler(Looper.getMainLooper()).postDelayed({
                                  Process.killProcess(Process.myPid())
                                  System.exit(0)
                              }, 200)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun disconnectWifi() {
                  try {
                      val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      // Wi-Fi ချိတ်ဆက်မှု ဖြုတ်ချခြင်း
                      wifiManager.disconnect()
                      @Suppress("DEPRECATION")
                      wifiManager.isWifiEnabled = false
                  } catch (e: Exception) {}
              }

              private fun wakeUpScreen() {
                  try {
                      val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = powerManager.newWakeLock(
                          PowerManager.SCREEN_BRIGHT_WAKE_LOCK or
                          PowerManager.ACQUIRE_CAUSES_WAKEUP or
                          PowerManager.ON_AFTER_RELEASE,
                          "charge_monitor:BeaconWakeLock"
                      ).apply {
                          acquire(12 * 1000L)
                      }

                      runOnUiThread {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                              setShowWhenLocked(true)
                              setTurnScreenOn(true)
                              val keyguardManager = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                              keyguardManager.requestDismissKeyguard(this, null)
                          } else {
                              @Suppress("DEPRECATION")
                              window.addFlags(
                                  WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                                  WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD or
                                  WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or
                                  WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                              )
                          }
                          window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      }
                  } catch (e: Exception) {}
              }

              private fun releaseWakeLock() {
                  try {
                      if (wakeLock?.isHeld == true) {
                          wakeLock?.release()
                      }
                      wakeLock = null
                  } catch (e: Exception) {}
              }

              private fun startAlarmSound() {
                  try {
                      stopAlarmSound()
                      var alertUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                          ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)

                      mediaPlayer = MediaPlayer().apply {
                          setDataSource(applicationContext, alertUri)
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          isLooping = true
                          prepare()
                          start()
                      }
                  } catch (e: Exception) {
                      try {
                          val fallbackUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          mediaPlayer = MediaPlayer.create(applicationContext, fallbackUri)?.apply {
                              isLooping = true
                              start()
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun stopAlarmSound() {
                  try {
                      mediaPlayer?.let {
                          if (it.isPlaying) it.stop()
                          it.release()
                      }
                      mediaPlayer = null
                  } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  stopAlarmSound()
                  releaseWakeLock()
                  super.onDestroy()
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Sign APK with Release Certificate
        run: |
          keytool -genkeypair -v -keystore release.jks -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=DataPlus, OU=Server, O=DataPlus, L=Yangon, ST=Yangon, C=MM"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS/zipalign -v -p 4 build/app/outputs/flutter-apk/app-release.apk aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias releaseKey --out build/app/outputs/flutter-apk/charge_monitor.apk aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: charge_monitor
          path: build/app/outputs/flutter-apk/charge_monitor.apk
