name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fix Android SDK to 36
        run: |
          python3 -c "
          import glob, os
          for f in glob.glob('android/app/build.gradle*'):
              c = open(f).read()
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              open(f, 'w').write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
