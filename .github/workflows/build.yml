name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Native Code (Tab ဆွဲပိတ်သည့် စနစ်) ကို APK ထဲ သေချာပေါက် ပါသွားစေရန် ရေးသားခြင်း
      - name: Inject Native Kill Mechanism
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/charge_monitor
          cat << 'EOF' > android/app/src/main/kotlin/com/example/charge_monitor/MainActivity.kt
          package com.example.charge_monitor

          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.os.Process
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.example.charge_monitor/app_control"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "killAppLikeSwipe") {
                          result.success(true)

                          try {
                              val serviceIntent = Intent(this, Class.forName("de.julianassmann.flutter_background.IsolateHolderService"))
                              stopService(serviceIntent)
                          } catch (_: Exception) {}

                          try {
                              val notificationManager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              notificationManager.cancelAll()
                          } catch (_: Exception) {}

                          finishAndRemoveTask()

                          Handler(Looper.getMainLooper()).postDelayed({
                              Process.killProcess(Process.myPid())
                              System.exit(0)
                          }, 200)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
