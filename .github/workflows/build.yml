name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android & Fix SDK & Disable AAR Check
        run: |
          # 1. battery_plus ဗားရှင်းကို အလိုအလျောက် မြှင့်ပေးသည်
          python3 -c "
          p = 'pubspec.yaml'
          t = open(p).read()
          t = t.replace('battery_plus: ^5.0.3', 'battery_plus: ^6.1.0')
          t = t.replace('battery_plus: 5.0.3', 'battery_plus: ^6.1.0')
          open(p, 'w').write(t)
          "

          # 2. Android Folder အသစ်ပြန်ဆောက်သည်
          rm -rf android
          flutter create . --platforms=android

          # 3. Permission, compileSdk 36 နှင့် AAR Metadata Check ပိတ်ခြင်း
          python3 -c "
          import glob, os

          # Internet Permission ထည့်သွင်းခြင်း
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              t = open(manifest).read()
              if 'android.permission.INTERNET' not in t:
                  t = t.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
                  open(manifest, 'w').write(t)

          # compileSdk 36 သတ်မှတ်ခြင်း
          for f in glob.glob('android/app/build.gradle*'):
              c = open(f).read()
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              open(f, 'w').write(c)

          # Gradle AAR Metadata Check ကို ကျော်ခိုင်းခြင်း (Error မတက်စေရန်)
          root_gradle = 'android/build.gradle.kts'
          if os.path.exists(root_gradle):
              extra = '''
          allprojects {
              afterEvaluate {
                  tasks.matching { it.name.contains(\"AarMetadata\") }.configureEach {
                      enabled = false
                  }
              }
          }
          '''
              open(root_gradle, 'a').write(extra)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Split ABI)
        run: flutter build apk --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-apks
          path: build/app/outputs/flutter-apk/*.apk
