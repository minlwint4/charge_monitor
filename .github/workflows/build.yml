name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Prepare Android Project
        run: |
          # 1. ပက်ကေ့ချ် ဗားရှင်းများကို အလိုအလျောက် မြှင့်ပေးသည်
          python3 -c "
          p = 'pubspec.yaml'
          t = open(p).read()
          t = t.replace('battery_plus: ^5.0.3', 'battery_plus: ^6.1.0')
          t = t.replace('battery_plus: 5.0.3', 'battery_plus: ^6.1.0')
          open(p, 'w').write(t)
          "

          # 2. Android Folder ကို အသန့်ပြန်ဆောက်သည်
          rm -rf android
          flutter create . --platforms=android

          # 3. Permission နှင့် SDK ဗားရှင်းများကိုသာ သတ်မှတ်သည် (AarMetadata Hack မလိုတော့ပါ)
          python3 -c "
          import glob, os

          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              t = open(manifest).read()
              if 'android.permission.INTERNET' not in t:
                  t = t.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
                  open(manifest, 'w').write(t)

          for f in glob.glob('android/app/build.gradle*'):
              c = open(f).read()
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
              c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              open(f, 'w').write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Split ABI)
        run: flutter build apk --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-apks
          path: build/app/outputs/flutter-apk/*.apk
