name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android & Fix SDK Versions
        run: |
          # Android folder ကို အသစ်ပြန်ဆောက်သည်
          rm -rf android
          flutter create . --platforms=android

          # compileSdk 34, minSdk 21 နှင့် Internet Permission များကို တစ်ခါတည်း သတ်မှတ်သည်
          python3 -c "
          import glob, os

          # 1. Internet Permission ထည့်သွင်းခြင်း
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              text = open(manifest).read()
              if 'android.permission.INTERNET' not in text:
                  text = text.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
                  open(manifest, 'w').write(text)

          # 2. compileSdk 34 နှင့် minSdk 21 သို့ ပြောင်းလဲခြင်း
          for f in glob.glob('android/app/build.gradle*'):
              c = open(f).read()
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
              c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              open(f, 'w').write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Split ABI)
        run: flutter build apk --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-apks
          path: build/app/outputs/flutter-apk/*.apk
