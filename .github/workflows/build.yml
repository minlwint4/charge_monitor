name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android with V2 Embedding
        run: |
          rm -rf android
          flutter create . --platforms android --org com.dataplus

      # ၁။ Android 14 Foreground Service Type နှင့် Permissions အပြည့်အစုံ ထည့်သွင်းခြင်း
      - name: Inject AndroidManifest with Foreground Service Type
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD"/>

              <application
                  android:label="charge_monitor"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- Android 14 Background Service အလုပ်လုပ်ခွင့်ပြုချက် -->
                  <service
                      android:name="de.julianassmann.flutter_background.IsolateHolderService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      # ၂။ Allow နှိပ်လိုက်သည်နှင့် Flutter ဆီ အသိပေးမည့် MainActivity.kt
      - name: Inject Native MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/dataplus/charge_monitor
          cat << 'EOF' > android/app/src/main/kotlin/com/dataplus/charge_monitor/MainActivity.kt
          package com.dataplus.charge_monitor

          import android.Manifest
          import android.app.KeyguardManager
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.Process
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.example.charge_monitor/app_control"
              private var mediaPlayer: MediaPlayer? = null
              private var beaconWakeLock: PowerManager.WakeLock? = null
              private var keepAliveCpuLock: PowerManager.WakeLock? = null
              private var keepAliveWifiLock: WifiManager.WifiLock? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  acquireKeepAliveLocks()

                  // Android 13+ Notification ခွင့်ပြုချက် တောင်းခံခြင်း
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startAlarm" -> {
                              wakeUpScreen()
                              startAlarmSound()
                              result.success(true)
                          }
                          "stopAlarm" -> {
                              stopAlarmSound()
                              releaseBeaconWakeLock()
                              result.success(true)
                          }
                          "killAppLikeSwipe" -> {
                              result.success(true)
                              stopAlarmSound()
                              releaseBeaconWakeLock()
                              releaseKeepAliveLocks()

                              try {
                                  val serviceIntent = Intent(this, Class.forName("de.julianassmann.flutter_background.IsolateHolderService"))
                                  stopService(serviceIntent)
                              } catch (_: Exception) {}

                              try {
                                  val notificationManager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                                  notificationManager.cancelAll()
                              } catch (_: Exception) {}

                              finishAndRemoveTask()

                              Handler(Looper.getMainLooper()).postDelayed({
                                  Process.killProcess(Process.myPid())
                                  System.exit(0)
                              }, 200)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              // Popup မှ Allow နှိပ်လိုက်သည်နှင့် Flutter ထဲသို့ ချက်ချင်း အချက်ပြပေးမည့် စနစ်
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      flutterEngine?.dartExecutor?.binaryMessenger?.let { messenger ->
                          MethodChannel(messenger, CHANNEL).invokeMethod("onNotificationPermissionGranted", null)
                      }
                  }
              }

              private fun acquireKeepAliveLocks() {
                  try {
                      val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                      keepAliveCpuLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "charge_monitor:KeepAliveCpu").apply {
                          acquire()
                      }
                      val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      keepAliveWifiLock = wifiManager.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "charge_monitor:KeepAliveWifi").apply {
                          acquire()
                      }
                  } catch (_: Exception) {}
              }

              private fun releaseKeepAliveLocks() {
                  try {
                      if (keepAliveCpuLock?.isHeld == true) keepAliveCpuLock?.release()
                      keepAliveCpuLock = null
                      if (keepAliveWifiLock?.isHeld == true) keepAliveWifiLock?.release()
                      keepAliveWifiLock = null
                  } catch (_: Exception) {}
              }

              private fun wakeUpScreen() {
                  try {
                      val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                      beaconWakeLock = powerManager.newWakeLock(
                          PowerManager.SCREEN_BRIGHT_WAKE_LOCK or
                          PowerManager.ACQUIRE_CAUSES_WAKEUP or
                          PowerManager.ON_AFTER_RELEASE,
                          "charge_monitor:BeaconWakeLock"
                      ).apply {
                          acquire(18 * 1000L)
                      }

                      runOnUiThread {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                              setShowWhenLocked(true)
                              setTurnScreenOn(true)
                              val keyguardManager = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                              keyguardManager.requestDismissKeyguard(this, null)
                          } else {
                              @Suppress("DEPRECATION")
                              window.addFlags(
                                  WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                                  WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD or
                                  WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or
                                  WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                              )
                          }
                          window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      }
                  } catch (_: Exception) {}
              }

              private fun releaseBeaconWakeLock() {
                  try {
                      if (beaconWakeLock?.isHeld == true) {
                          beaconWakeLock?.release()
                      }
                      beaconWakeLock = null
                  } catch (_: Exception) {}
              }

              private fun startAlarmSound() {
                  try {
                      stopAlarmSound()
                      var alertUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                          ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)

                      mediaPlayer = MediaPlayer().apply {
                          setDataSource(applicationContext, alertUri)
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          isLooping = true
                          prepare()
                          start()
                      }
                  } catch (_: Exception) {
                      try {
                          val fallbackUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          mediaPlayer = MediaPlayer.create(applicationContext, fallbackUri)?.apply {
                              isLooping = true
                              start()
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun stopAlarmSound() {
                  try {
                      mediaPlayer?.let {
                          if (it.isPlaying) it.stop()
                          it.release()
                      }
                      mediaPlayer = null
                  } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  stopAlarmSound()
                  releaseBeaconWakeLock()
                  releaseKeepAliveLocks()
                  super.onDestroy()
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK to charge_monitor.apk
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/charge_monitor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: charge_monitor
          path: build/app/outputs/flutter-apk/charge_monitor.apk
