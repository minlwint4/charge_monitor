name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Prepare Android Project
        run: |
          # 1. Android Folder အဟောင်းကိုဖျက်၍ V2 Embedding အသစ်ဖြင့် ပြန်ဆောက်သည်
          rm -rf android
          flutter create . --platforms=android

          # 2. Permissions နှင့် SDK ဗားရှင်းများကို သတ်မှတ်သည်
          python3 -c "
          import glob, os

          # Permissions (Internet, WakeLock, Foreground Service) ထည့်သွင်းခြင်း
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              t = open(manifest).read()
              if 'android.permission.INTERNET' not in t:
                  permissions = '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>\n    <application'
                  t = t.replace('<application', permissions)
                  open(manifest, 'w').write(t)

          # compileSdk 36 နှင့် minSdk 21 သို့ ပြောင်းလဲခြင်း
          for f in glob.glob('android/app/build.gradle*'):
              c = open(f).read()
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              open(f, 'w').write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
